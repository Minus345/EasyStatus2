<!DOCTYPE html>
<html lang="de">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"
        integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA=="
        crossorigin="anonymous"></script>
<link rel="stylesheet" href="/static/status.css" type="text/css">
<script src="/static/status.js"></script>
<head>
    <meta charset="UTF-8">
    <title>Easy Status</title>
    <link rel="stylesheet" href="/static/status.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<header>
    <h1>Easy Status</h1>
    <div class="online-status">
        Connected:
        <svg id="socket-status" width="18" height="18" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" fill="red"></circle>
        </svg>
    </div>
</header>
<div class="status-table">
    <table id="table">
        <thead>
        <tr>
        </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <div class="control-buttons-box">
        <button id="add-wk" class="control-buttons" onclick="addWk()">Wettkampf hinzufügen</button>
        <button id="rm-wk" class="control-buttons" onclick="rmWk()">Wettkampf entfernen</button>
    </div>
</div>

<dialog id="add-wk-dialog" popover closedby="any">
    <p>Wettkampf hinzufügen: </p>
    <label for="wk-number">Nummer: </label>
    <input type="number" name="wk-number" id="wk-number-add" placeholder="WK-Nummer" tabindex="1">
    <br>
    <label for="wk-name">Name: </label>
    <input type="text" name="wk-name" id="wk-name-add" placeholder="Name" tabindex="2">
    <div class="control-buttons-in-dialog">
        <button commandfor="add-wk-dialog" command="close" type="button" tabindex="4">Close</button>
        <button onclick="sendAddWK()" tabindex="3">Submit</button>
    </div>
</dialog>

<dialog id="rm-wk-dialog" popover closedby="any">
    <p>Wettkampf entfernen: </p>
    <label for="wk-number">Nummer: </label>
    <input type="number" name="wk-number" id="wk-number-rm" placeholder="WK-Nummer" tabindex="1">
    <div class="control-buttons-in-dialog">
        <button commandfor="rm-wk-dialog" command="close" type="button" tabindex="4">Close</button>
        <button onclick="sendRmWK()" tabindex="3">Submit</button>
    </div>
</dialog>


</body>
</html>
